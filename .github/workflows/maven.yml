name: Test Automation Assignment WorkFlow

on:
  schedule:
    - cron: '30 18 * * *'

  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Running test automation framework with maven on github actions
        run: mvn clean test -Dbrowser=edge -Dislambda=false -Disheadless=false

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test reports
          path: report.html
          if-no-files-found: ignore

      - name: Test Execution status
        run: echo "Test execution completed"
